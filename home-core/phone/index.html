<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#02070a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ISAAC</title>
  <style>
    :root{color-scheme:dark;--app-height:100dvh;--bay-image:none;--reactor-image:none}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#010406;color:#e8f9ff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif}
    body{position:fixed;inset:0}
    .environment{position:fixed;inset:0;overflow:hidden;background:#010406;pointer-events:none}
    .bay{position:absolute;inset:-3%;background-image:var(--bay-image);background-repeat:no-repeat;background-position:59% center;background-size:auto 106%;filter:brightness(.67) contrast(1.12) saturate(.72);transform:scale(1.04)}
    .reactor{position:absolute;inset:0;background-image:var(--reactor-image);background-repeat:no-repeat;background-position:center 7vh;background-size:auto 72vh;filter:brightness(.96) contrast(1.14);-webkit-mask-image:radial-gradient(ellipse 78% 46% at 50% 38%,#000 0 57%,rgba(0,0,0,.96) 70%,rgba(0,0,0,.42) 88%,transparent 100%),linear-gradient(to bottom,#000 0 70%,transparent 88%);-webkit-mask-composite:source-in;mask-image:radial-gradient(ellipse 78% 46% at 50% 38%,#000 0 57%,rgba(0,0,0,.96) 70%,rgba(0,0,0,.42) 88%,transparent 100%),linear-gradient(to bottom,#000 0 70%,transparent 88%);mask-composite:intersect}
    .reactor-white{position:absolute;inset:0;background-image:var(--reactor-image);background-repeat:no-repeat;background-position:center 7vh;background-size:auto 72vh;filter:grayscale(1) contrast(2.35) brightness(1.42);mix-blend-mode:screen;opacity:.64;-webkit-mask-image:radial-gradient(ellipse 62% 39% at 50% 37%,#000 0 57%,rgba(0,0,0,.78) 78%,transparent 100%),linear-gradient(to bottom,#000 0 68%,transparent 86%);-webkit-mask-composite:source-in;mask-image:radial-gradient(ellipse 62% 39% at 50% 37%,#000 0 57%,rgba(0,0,0,.78) 78%,transparent 100%),linear-gradient(to bottom,#000 0 68%,transparent 86%);mask-composite:intersect}
    .energy{position:absolute;left:50%;top:36%;width:58vw;height:42vh;transform:translate(-50%,-50%);background:radial-gradient(ellipse at center,rgba(255,255,255,.32),rgba(236,250,255,.14) 24%,rgba(126,220,247,.045) 50%,transparent 72%);mix-blend-mode:screen;filter:blur(5px);opacity:.55;animation:idleEnergy 5.2s ease-in-out infinite}
    .platform-glow{position:absolute;left:50%;top:66%;width:92vw;height:20vh;transform:translate(-50%,-50%);background:radial-gradient(ellipse,rgba(255,255,255,.15),rgba(179,235,251,.055) 40%,transparent 70%);mix-blend-mode:screen;filter:blur(4px);opacity:.55;transition:opacity .25s ease}
    @keyframes idleEnergy{50%{opacity:.72;transform:translate(-50%,-50%) scale(1.025)}}
    body[data-state="thinking"] .energy{opacity:1;animation:thinkingEnergy 1.35s ease-in-out infinite}
    body[data-state="thinking"] .platform-glow{opacity:.92}
    @keyframes thinkingEnergy{0%,100%{transform:translate(-50%,-50%) scale(1);filter:blur(4px)}50%{transform:translate(-50%,-50%) scale(1.12);filter:blur(8px)}}
    .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,3,6,.5) 0,transparent 22%,transparent 58%,rgba(0,3,6,.48) 78%,rgba(0,2,4,.9) 100%),linear-gradient(90deg,rgba(0,3,6,.38),transparent 25%,transparent 75%,rgba(0,3,6,.25))}
    main{position:relative;z-index:2;width:100%;height:var(--app-height);display:grid;grid-template-rows:auto minmax(0,1fr) auto;padding:max(14px,env(safe-area-inset-top)) 15px max(10px,env(safe-area-inset-bottom));overflow:hidden;background:radial-gradient(ellipse at 0 47%,rgba(0,4,7,.34),transparent 70%)}
    header{display:flex;align-items:center;gap:8px;min-height:34px;padding:2px 4px 7px;text-shadow:0 1px 12px #000}
    h1{margin:0;font-size:13px;font-weight:500;letter-spacing:.3em;color:#e7fbff}
    #status{flex:0 0 auto;white-space:nowrap;font-size:9px;letter-spacing:.18em;color:rgba(179,227,240,.66)}
    .chat-name{margin-left:auto;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border:0;background:transparent;color:rgba(215,243,250,.76);font-size:10px}.new-chat{min-width:30px;min-height:30px;border:0;background:transparent;font-size:18px}.chat-menu{position:absolute;z-index:5;top:max(50px,calc(env(safe-area-inset-top) + 38px));left:14px;right:14px;max-height:42vh;overflow:auto;padding:7px;background:rgba(1,7,10,.95);border:1px solid rgba(170,230,245,.22);box-shadow:0 12px 34px #000}.chat-menu[hidden]{display:none}.chat-option{display:block;width:100%;min-height:38px;border:0;background:transparent;text-align:left;color:#dff6fc;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    #status::before{content:"";display:inline-block;width:5px;height:5px;margin-right:7px;border-radius:50%;background:#f5feff;box-shadow:0 0 9px #fff;vertical-align:1px}
    #messages{min-height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:17px;padding:16px 4px 28vh;scrollbar-width:none;mask-image:linear-gradient(to bottom,transparent,#000 4%,#000 96%,transparent)}
    #messages::-webkit-scrollbar{display:none}
    .message{max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.48;text-shadow:0 2px 12px #000,0 0 6px #000;transition:opacity .2s ease}
    .message.user{align-self:flex-end;padding-right:9px;border-right:1px solid rgba(184,232,244,.28);font-size:13px;color:rgba(201,230,238,.69)}
    .message.isaac{align-self:flex-start;font-size:15px;color:rgba(239,252,255,.96)}
    .message.isaac::before{content:"ISAAC / ";font-size:8px;letter-spacing:.2em;color:rgba(188,238,250,.72)}
    .message:nth-last-child(n+8){opacity:.24}.message:nth-last-child(7){opacity:.34}.message:nth-last-child(6){opacity:.46}.message:nth-last-child(5){opacity:.6}
    form{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 54px;align-items:end;gap:8px;padding:8px 4px 2px;background:linear-gradient(90deg,transparent,rgba(3,10,14,.7) 8%,rgba(3,10,14,.74) 92%,transparent);backdrop-filter:blur(9px);-webkit-backdrop-filter:blur(9px)}
    form::before{content:"";position:absolute;left:4%;right:4%;top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(225,250,255,.38),transparent)}
    textarea{width:100%;min-width:0;min-height:46px;max-height:132px;resize:none;overflow-y:auto;border:0;outline:0;border-radius:0;background:transparent;color:#f3fcff;padding:11px 8px 8px;font-size:16px;line-height:1.35;font-family:inherit;caret-color:#fff}
    textarea::placeholder{color:rgba(190,225,235,.42)}
    button{min-width:48px;min-height:46px;border:1px solid rgba(211,246,255,.25);border-radius:3px;background:rgba(7,18,23,.64);color:#eefcff;font:600 10px/1 inherit;letter-spacing:.1em}
    button:active{background:rgba(225,250,255,.15)}button:disabled{opacity:.36}
    @media(max-height:650px){.reactor,.reactor-white{background-size:auto 68vh;background-position:center 5vh}.energy{top:34%;height:38vh}#messages{padding-bottom:19vh}}
    @media(min-width:600px) and (orientation:portrait){main{padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right))}.reactor,.reactor-white{background-size:auto 68vh}}
    @media(prefers-reduced-motion:reduce){.energy{animation:none!important}}
  </style>
</head>
<body data-state="idle">
  <div class="environment" aria-hidden="true">
    <div class="bay"></div><div class="reactor"></div><div class="reactor-white"></div>
    <div class="energy"></div><div class="platform-glow"></div><div class="shade"></div>
  </div>
  <main>
    <header><h1>ISAAC</h1><span id="status">CONNECTING</span><button id="chat-name" class="chat-name" type="button">New Chat ▾</button><button id="new-chat" class="new-chat" type="button">＋</button></header>
    <div id="chat-menu" class="chat-menu" hidden></div>
    <section id="messages" role="log" aria-live="polite" aria-relevant="additions text"></section>
    <form id="form" autocomplete="off">
      <textarea id="input" maxlength="8000" placeholder="Talk to ISAAC" rows="1" aria-label="Message ISAAC"></textarea>
      <button id="send" type="submit">SEND</button>
    </form>
  </main>
  <script>
    const statusNode=document.querySelector('#status'),messages=document.querySelector('#messages'),form=document.querySelector('#form'),input=document.querySelector('#input'),send=document.querySelector('#send'),chatName=document.querySelector('#chat-name'),chatMenu=document.querySelector('#chat-menu');
    const token=new URLSearchParams(location.hash.slice(1)).get('token')||sessionStorage.getItem('isaac-token');
    if(token){sessionStorage.setItem('isaac-token',token);history.replaceState(null,'',location.pathname);const assetToken=encodeURIComponent(token);document.documentElement.style.setProperty('--bay-image',`url('/assets/reactor-bay.png?token=${assetToken}')`);document.documentElement.style.setProperty('--reactor-image',`url('/assets/reactor-master.png?token=${assetToken}')`)}
    let conversationId,current;
    const state=(name,label=name.toUpperCase())=>{document.body.dataset.state=name;statusNode.textContent=label};
    const scrollLatest=()=>{messages.scrollTop=messages.scrollHeight};
    const resizeInput=()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,132)+'px'};
    const add=(role,text='')=>{const node=document.createElement('div');node.className='message '+role;node.textContent=text;messages.append(node);scrollLatest();return node};
    const api=async(path,body,method='POST')=>{const response=await fetch(path,{method,headers:{Authorization:'Bearer '+token,...(method==='POST'?{'Content-Type':'application/json'}:{})},body:method==='POST'?JSON.stringify(body||{}):undefined});if(!response.ok)throw new Error((await response.json()).error||'Request failed');return response.json()};
    const showChat=result=>{conversationId=result.conversationId;chatName.textContent=(result.title||'New Chat')+' ▾';messages.replaceChildren();for(const message of result.messages||[])add(message.role==='assistant'?'isaac':'user',message.content);current=null;send.disabled=false;scrollLatest()};
    async function loadChats(){const result=await api('/api/conversations',null,'GET');chatMenu.replaceChildren();for(const chat of result.conversations||[]){const button=document.createElement('button');button.className='chat-option';button.textContent=chat.title;button.onclick=async()=>{showChat(await api('/api/conversations/select',{conversationId:chat.conversationId}));chatMenu.hidden=true;input.focus()};chatMenu.append(button)}}
    async function start(){if(!token)throw new Error('Open the temporary pairing link from ISAAC Home');showChat(await api('/api/conversations/bootstrap'));const events=new EventSource('/api/events?token='+encodeURIComponent(token));events.onopen=()=>state('idle','READY');events.onerror=()=>state('idle','RECONNECTING');events.onmessage=event=>{const envelope=JSON.parse(event.data);if(envelope.conversationId&&envelope.conversationId!==conversationId)return;if(envelope.type==='isaac.thinking')state('thinking','THINKING');if(envelope.type==='isaac.response.started'){current=add('isaac');send.disabled=true}if(envelope.type==='isaac.response.delta'&&current){current.textContent+=envelope.payload.delta;scrollLatest()}if(envelope.type==='isaac.response.completed'){current=null;send.disabled=false;state('idle','READY');input.focus()}if(envelope.type==='isaac.response.cancelled'){current=null;send.disabled=false;state('idle','CANCELLED')}if(envelope.type==='isaac.error'){add('isaac',envelope.payload?.message||'Generation failed');send.disabled=false;state('idle','ERROR')}};input.focus()}
    form.addEventListener('submit',async event=>{event.preventDefault();const content=input.value.trim();if(!content||!conversationId)return;add('user',content);input.value='';resizeInput();send.disabled=true;state('thinking','THINKING');try{await api('/api/messages',{conversationId,content})}catch(error){add('isaac',error.message);send.disabled=false;state('idle','ERROR')}});
    input.addEventListener('input',resizeInput);input.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();form.requestSubmit()}});
    chatName.addEventListener('click',async()=>{chatMenu.hidden=!chatMenu.hidden;if(!chatMenu.hidden)await loadChats()});document.querySelector('#new-chat').addEventListener('click',async()=>{showChat(await api('/api/conversations'));chatMenu.hidden=true;input.focus()});
    const updateViewport=()=>{document.documentElement.style.setProperty('--app-height',(window.visualViewport?.height||window.innerHeight)+'px');scrollLatest()};
    window.visualViewport?.addEventListener('resize',updateViewport);window.addEventListener('orientationchange',updateViewport);updateViewport();start().catch(error=>{state('idle','ERROR');add('isaac',error.message)});
  </script>
</body>
</html>
